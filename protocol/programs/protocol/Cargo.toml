[package]
name = "protocol"
version = "0.1.0"
description = "CrypSurance parametric cover protocol"
edition = "2021"
# Solana's SBF build toolchain ships cargo 1.84, which cannot parse manifests
# that declare edition 2024. Combined with the MSRV-aware resolver in
# .cargo/config.toml, this stops dependency resolution from pulling crate
# versions the build toolchain can't read.
rust-version = "1.84.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "protocol"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
