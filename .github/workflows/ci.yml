name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# Nothing here writes anywhere. Deployment is a separate workflow.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: lint, wire-format tests, and the static export.
  web:
    name: Site and client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24, i.e. npm 11 — the version package-lock.json was generated by.
      # npm 10 rejects it outright ("Missing: utf-8-validate from lock file"),
      # because the two disagree about how optional peer deps are recorded.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Failure output is echoed as a GitHub annotation, not just into the log:
      # workflow logs need repo-admin auth to read, and an install that fails
      # for an unreadable reason is a CI that nobody can fix.
      - name: Install dependencies
        run: |
          set +e
          npm ci > npm-ci.log 2>&1
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            echo "::error::npm ci failed (exit $code): $(tail -c 1200 npm-ci.log | tr '\n' ' ')"
            cat npm-ci.log
            exit $code
          fi

      - name: Lint
        run: npm run lint

      # Checks the hand-rolled Anchor encoding against how Anchor derives it.
      # Cheap, and it covers the one code path that otherwise can only be
      # exercised in a browser with a wallet attached.
      - name: Client wire-format tests
        run: npm test

      - name: Build static export
        run: npm run build

  # The program's own tests, against a local validator. These are the security
  # tests — that the oracle cannot redirect a payout, that only the holder can
  # claim, that premiums are computed on-chain — so they gate merges even
  # though the toolchain takes a while to install.
  program:
    name: Anchor program
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: protocol
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # anchor-cli builds solana crates whose build scripts link against system
      # libraries. The runner image doesn't carry libudev or the OpenSSL
      # headers, and without them cargo aborts early in the build.
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config build-essential libudev-dev libssl-dev

      # Versions pinned to the ones the program is developed and deployed
      # with. Floating these has broken Anchor builds before; a green CI on a
      # toolchain nobody uses proves nothing.
      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            protocol/target
          key: rust-anchor0.32.1-${{ hashFiles('protocol/Cargo.lock') }}
          restore-keys: rust-anchor0.32.1-

      - name: Cache Solana toolchain
        uses: actions/cache@v4
        with:
          path: ~/.local/share/solana
          key: solana-3.0.11

      - name: Install Solana CLI
        run: |
          if [ ! -x "$HOME/.local/share/solana/install/active_release/bin/solana" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/v3.0.11/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # Built from the repo root on purpose: protocol/rust-toolchain.toml pins
      # rustc 1.89 for the program, and the CLI wants a newer compiler.
      - name: Install Anchor CLI
        working-directory: ${{ github.workspace }}
        run: |
          if command -v anchor >/dev/null; then exit 0; fi
          set +e
          cargo install --locked anchor-cli@0.32.1 > anchor-install.log 2>&1
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            echo "::error::anchor-cli install failed (exit $code): $(grep -i -m3 '^error' anchor-install.log | tr '\n' ' ')"
            tail -80 anchor-install.log
            exit $code
          fi

      # anchor test needs a payer keypair; a throwaway one is correct here —
      # everything runs against a local validator that this job starts and
      # discards. No project key ever touches CI.
      - name: Create a local validator keypair
        run: solana-keygen new --no-bip39-passphrase --silent --force -o ~/.config/solana/id.json

      - run: npm install

      # --provider.cluster localnet is not optional: Anchor.toml points at
      # devnet for deploys, and `anchor test` would otherwise run against the
      # live deployment instead of a throwaway validator.
      - name: anchor test
        run: anchor test --provider.cluster localnet

      # The committed IDL is what the site and the oracle read. If a build
      # changes it, the commit must carry the new one. Compared as normalized
      # JSON so key order and whitespace don't fail the build on their own.
      - name: Committed IDL matches the built program
        run: |
          if ! diff <(jq -S . idl/protocol.json) <(jq -S . target/idl/protocol.json); then
            echo "::error::idl/protocol.json is stale. Run anchor build and copy target/idl/protocol.json into idl/."
            exit 1
          fi
