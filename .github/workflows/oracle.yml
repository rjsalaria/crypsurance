name: CrypSurance Claims Oracle

# Settles pending claims by calling the on-chain program.
#
# This runs here rather than in the Cloudflare Worker because no RPC available
# to us serves account reads from Cloudflare's IP ranges: Helius' free tier
# rejects getAccountInfo / getMultipleAccounts / getProgramAccounts outright,
# and Solana's public RPC blocks Cloudflare. GitHub runners can use the public
# RPC, so the oracle lives here; the Worker keeps the faucet and RPC proxy.
#
# GitHub's cron is best effort — it delayed our scheduled runs by ~16 minutes
# on average and skipped enough that real gaps reached 224 minutes. The public
# run history is the honest record of when it actually ran.
#
# Since M3 week 2 a claim needs the registry's threshold of operators to agree
# before it settles, so ONE operator running here would leave every claim stuck
# at 1-of-2 forever.
#
# Each operator therefore runs as its OWN JOB, not as another step in a shared
# one. That matters for three reasons, in increasing order of importance:
#
#   - GitHub gives every job its own runner VM, so the operators no longer
#     share an IP. Three passes from one address is what tripped the public
#     RPC's per-IP rate limit and made the third one fail every time.
#   - They no longer share a process or a working directory.
#   - fail-fast is off, so one operator failing no longer prevents the others
#     from attesting at all. As sequential steps they shared a single fate:
#     if the first operator errored, the rest were skipped, and a claim that
#     needed two agreeing operators got none. A set of operators that all stop
#     when one stops is not a set of operators.
#
# They are still all GitHub-hosted and all keyed from this repo's secrets, so
# this is separate infrastructure, NOT independent operation. Say the first,
# never the second.
#
# Required secrets: DEVNET_KEYPAIR (the oracle key), AVIATIONSTACK_KEY.
# Optional: OPERATOR_A_KEYPAIR, OPERATOR_B_KEYPAIR -- additional registered
# operators. Without at least one of them, nothing reaches the threshold.
# RPC_URL is deliberately NOT used: Helius cannot serve the account reads this
# needs, so the default public RPC is correct here.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

# Serialise runs of the whole workflow, not the operators within a run: two
# scheduled runs overlapping would have operators attesting twice, but the
# three operators inside one run are meant to be concurrent.
concurrency:
  group: claims-oracle
  cancel-in-progress: false

jobs:
  attest:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      # Every operator gets its own runner, and one failing must not cancel
      # the others -- that is the entire point of there being more than one.
      fail-fast: false
      matrix:
        include:
          - label: oracle operator
            secret: DEVNET_KEYPAIR
          - label: operator A
            secret: OPERATOR_A_KEYPAIR
          - label: operator B
            secret: OPERATOR_B_KEYPAIR

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install client dependencies
        working-directory: protocol
        run: npm install --no-audit --no-fund

      - name: Attest
        working-directory: protocol
        env:
          OPERATOR_KEY: ${{ secrets[matrix.secret] }}
          AVIATIONSTACK_KEY: ${{ secrets.AVIATIONSTACK_KEY }}
        run: |
          if [ -z "$OPERATOR_KEY" ]; then
            echo "::notice::${{ matrix.label }}: ${{ matrix.secret }} is not set — running with fewer operators"
            exit 0
          fi
          printf '%s' "$OPERATOR_KEY" > op.json
          bash scripts/attest.sh "${{ matrix.label }}" op.json
