name: CrypSurance Claims Oracle

# Settles pending claims by calling the on-chain program.
#
# This runs here rather than in the Cloudflare Worker because no RPC available
# to us serves account reads from Cloudflare's IP ranges: Helius' free tier
# rejects getAccountInfo / getMultipleAccounts / getProgramAccounts outright,
# and Solana's public RPC blocks Cloudflare. GitHub runners can use the public
# RPC, so the oracle lives here; the Worker keeps the faucet and RPC proxy.
#
# GitHub's cron is best effort — it delayed our scheduled runs by ~16 minutes
# on average and skipped enough that real gaps reached 224 minutes. The public
# run history is the honest record of when it actually ran.
#
# Since M3 week 2 a claim needs the registry's threshold of operators to agree
# before it settles, so ONE operator running here would leave every claim stuck
# at 1-of-2 forever. This job therefore runs the same script once per operator
# key it has been given. They are separate processes but not yet separate
# hosts or separate keystores -- that independence is week 4's work, and it
# should not be described as decentralised until then.
#
# Required secrets: DEVNET_KEYPAIR (the oracle key), AVIATIONSTACK_KEY.
# Optional: OPERATOR_A_KEYPAIR, OPERATOR_B_KEYPAIR -- additional registered
# operators. Without at least one of them, nothing reaches the threshold.
# RPC_URL is deliberately NOT used: Helius cannot serve the account reads this
# needs, so the default public RPC is correct here.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: claims-oracle
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install client dependencies
        working-directory: protocol
        run: npm install --no-audit --no-fund

      # Each operator attests in its own run of the script. The last one to
      # push the tally past the threshold also cranks settlement -- any of them
      # can, because settle_claim checks no key at all.
      - name: Attest as the oracle operator
        working-directory: protocol
        run: |
          printf '%s' "$DEVNET_KEYPAIR" > op-oracle.json
          bash scripts/attest.sh "oracle operator" op-oracle.json
        env:
          DEVNET_KEYPAIR: ${{ secrets.DEVNET_KEYPAIR }}
          AVIATIONSTACK_KEY: ${{ secrets.AVIATIONSTACK_KEY }}

      - name: Attest as operator A
        working-directory: protocol
        run: |
          if [ -z "$OPERATOR_A_KEYPAIR" ]; then
            echo "::warning::OPERATOR_A_KEYPAIR is not set — claims will stall below the threshold"
            exit 0
          fi
          printf '%s' "$OPERATOR_A_KEYPAIR" > op-a.json
          bash scripts/attest.sh "operator A" op-a.json
        env:
          OPERATOR_A_KEYPAIR: ${{ secrets.OPERATOR_A_KEYPAIR }}
          AVIATIONSTACK_KEY: ${{ secrets.AVIATIONSTACK_KEY }}

      - name: Attest as operator B
        working-directory: protocol
        run: |
          if [ -z "$OPERATOR_B_KEYPAIR" ]; then
            echo "::notice::OPERATOR_B_KEYPAIR is not set — running with fewer operators"
            exit 0
          fi
          printf '%s' "$OPERATOR_B_KEYPAIR" > op-b.json
          bash scripts/attest.sh "operator B" op-b.json
        env:
          OPERATOR_B_KEYPAIR: ${{ secrets.OPERATOR_B_KEYPAIR }}
          AVIATIONSTACK_KEY: ${{ secrets.AVIATIONSTACK_KEY }}
